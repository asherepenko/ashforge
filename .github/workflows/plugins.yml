name: plugins

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Run tests
        run: pytest --import-mode=importlib tests plugins/android-expert-toolkit/tests plugins/ios-expert-toolkit/tests plugins/avengers-council/tests -q -m "not network"
      - name: Shellcheck
        run: shellcheck plugins/*/scripts/*.sh
